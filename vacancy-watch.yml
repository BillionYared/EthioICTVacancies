name: Ethiopia ICT Vacancy Watch

on:
  workflow_dispatch:
    inputs:
      send_test_message:
        description: Send a Telegram connection test
        required: false
        default: false
        type: boolean
  schedule:
    # 05:17, 11:17 and 17:17 UTC = 08:17, 14:17 and 20:17 Ethiopia time.
    - cron: '17 5,11,17 * * *'

permissions:
  contents: write

concurrency:
  group: vacancy-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Search and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_ALERTS_PER_RUN: '12'
          SEND_TEST_MESSAGE: ${{ inputs.send_test_message && '1' || '0' }}
        run: python main.py

      - name: Save duplicate history
        run: |
          if git diff --quiet -- data/seen_jobs.json; then
            echo "No history changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json
          git commit -m "chore: update vacancy history"
          git push
